name: CI
on:
  pull_request:
jobs:
  delivery-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delivery check
        run: |
          if [ -f cadence-seed/FAIL_MARKER ]; then
            echo "Seeded failing check"; exit 1
          fi
          echo "OK"
